[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyfind"
version = "0.1.0"
description = "Efficient search for stable atomic arrangements in semi-crystalline polymers (RIS dynamic programming + helical-symmetry packing + multi-fidelity refinement)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ase = ["ase>=3.22"]

[project.scripts]
polyfind = "polyfind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
